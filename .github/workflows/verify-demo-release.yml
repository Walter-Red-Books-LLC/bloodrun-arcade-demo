name: Verify demo release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-signing:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
      - run: npm ci
      - run: npm run test:updater
      - run: npm run build
      - name: Verify hosted signing and Apple notarization without publishing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_FOR_PULL_REQUEST: "false"
        run: |
          npx electron-builder --mac dir --arm64 --publish never -c.directories.output=release/hosted-verification
          codesign --verify --deep --strict "release/hosted-verification/mac-arm64/BLOODRUN DEMO.app"
          xcrun stapler validate "release/hosted-verification/mac-arm64/BLOODRUN DEMO.app"
          spctl --assess --type execute --verbose=2 "release/hosted-verification/mac-arm64/BLOODRUN DEMO.app"
  windows-install-update:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
      - run: npm ci
      - run: npm run test:updater
      - run: npm run build
      - name: Download the exact unpublished release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $demoVersion = node -p 'require("./package.json").version'
          New-Item -ItemType Directory -Force release/windows-verification | Out-Null
          gh release download "v$demoVersion" --repo "$env:GITHUB_REPOSITORY" --pattern "BLOODRUN-DEMO-Setup-$demoVersion.exe" --pattern demo.yml --dir release/windows-verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "release/windows-verification/BLOODRUN-DEMO-Setup-$demoVersion.exe" "release/windows-verification/BLOODRUN DEMO Setup $demoVersion.exe"
      - name: Verify Windows install, download, Later, restart and state preservation
        run: node tests/windows-installed-updater.cjs
