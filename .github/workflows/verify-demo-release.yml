name: Verify demo release candidate
on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to verify
        type: choice
        default: both
        options: [both, mac, windows]
permissions:
  contents: read
jobs:
  mac-signing:
    if: inputs.target != 'windows'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
      - run: npm ci
      - run: npm run test:updater
      - run: npm run build
      - name: Verify hosted signing and Apple notarization without publishing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_FOR_PULL_REQUEST: "false"
        run: |
          npx electron-builder --mac dir --arm64 --publish never -c.directories.output=release/hosted-verification
          codesign --verify --deep --strict "release/hosted-verification/mac-arm64/BLOODRUN DEMO.app"
          xcrun stapler validate "release/hosted-verification/mac-arm64/BLOODRUN DEMO.app"
          spctl --assess --type execute --verbose=2 "release/hosted-verification/mac-arm64/BLOODRUN DEMO.app"
  windows-install-update:
    if: inputs.target != 'mac'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
      - run: npm ci
      - run: npm run test:updater
      - run: npm run build
      - name: Download the exact unpublished release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          DEMO_VERIFY_INSTALLER_URL: ${{ secrets.DEMO_VERIFY_INSTALLER_URL }}
          DEMO_VERIFY_MANIFEST_URL: ${{ secrets.DEMO_VERIFY_MANIFEST_URL }}
        shell: pwsh
        run: |
          $demoVersion = node -p 'require("./package.json").version'
          New-Item -ItemType Directory -Force release/windows-verification | Out-Null
          if ($env:DEMO_VERIFY_INSTALLER_URL -and $env:DEMO_VERIFY_MANIFEST_URL) {
            # Expiring, download-only access to these two draft assets. The
            # verification token retains contents: read and cannot publish.
            Invoke-WebRequest -Uri $env:DEMO_VERIFY_INSTALLER_URL -OutFile "release/windows-verification/BLOODRUN DEMO Setup $demoVersion.exe"
            Invoke-WebRequest -Uri $env:DEMO_VERIFY_MANIFEST_URL -OutFile release/windows-verification/demo.yml
          } else {
            gh release download "v$demoVersion" --repo "$env:GITHUB_REPOSITORY" --pattern "BLOODRUN-DEMO-Setup-$demoVersion.exe" --pattern demo.yml --dir release/windows-verification
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Move-Item "release/windows-verification/BLOODRUN-DEMO-Setup-$demoVersion.exe" "release/windows-verification/BLOODRUN DEMO Setup $demoVersion.exe"
          }
      - name: Verify Windows install, download, Later, restart and state preservation
        run: node tests/windows-installed-updater.cjs
